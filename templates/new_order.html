{% extends 'base.html' %}

{% block content %}
<div class="container py-4 py-lg-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="text-center mb-4">
                <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-2 mb-2 fw-semibold">{{ request_type }}</span>
                <h2 class="fw-bold text-dark">Оформление заявки</h2>
                <p class="text-muted">Заполните данные о вашем устройстве, и мы займемся решением проблемы.</p>
            </div>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4 p-md-5">
                    <form method="POST">
                        <h5 class="fw-bold mb-4 text-dark border-bottom pb-2">Об устройстве</h5>
                        
                        <div class="row g-3 mb-4">
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Тип техники</label>
                                <select name="device_type" class="form-select bg-light border-0" required>
                                    <option value="" disabled selected>Выберите тип</option>
                                    <option value="Ноутбук">Ноутбук</option>
                                    <option value="Системный блок ПК">Системный блок ПК</option>
                                    <option value="Моноблок">Моноблок</option>
                                    <option value="Видеокарта">Видеокарта</option>
                                    <option value="Игровая приставка">Игровая приставка</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-muted">Бренд и модель (если знаете)</label>
                                <input type="text" name="brand_model" class="form-control bg-light border-0" placeholder="Например: ASUS ROG Strix">
                            </div>
                        </div>

                        <h5 class="fw-bold mb-4 text-dark border-bottom pb-2 mt-5">В чем проблема?</h5>
                        
                        <div class="mb-4">
                            <label class="form-label small fw-semibold text-muted">Опишите, что произошло с устройством</label>
                            <textarea name="issue_description" class="form-control bg-light border-0" rows="4" placeholder="Не включается, шумит, синий экран..." required></textarea>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-5">
                            <a href="{{ url_for('index') }}" class="text-muted text-decoration-none fw-medium"><i class="fa-solid fa-arrow-left me-2"></i>Назад</a>
                            <button type="submit" class="btn btn-primary btn-lg rounded-pill px-5 fw-semibold shadow-sm">
                                Отправить заявку
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
