{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-10 col-lg-8 col-xl-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="row g-0">
                    <div class="col-12 p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h3 class="fw-bold text-dark">Добро пожаловать</h3>
                            <p class="text-muted small">Войдите или зарегистрируйтесь для оформления заявки</p>
                        </div>

                        <ul class="nav nav-pills nav-fill gap-2 p-1 bg-light rounded-pill mb-4" id="authTabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active rounded-pill fw-medium py-2" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginPane" type="button" role="tab">Вход</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link rounded-pill fw-medium py-2" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerPane" type="button" role="tab">Регистрация</button>
                            </li>
                        </ul>
                        
                        <div class="tab-content" id="authTabsContent">
                            <!-- Форма входа -->
                            <div class="tab-pane fade show active" id="loginPane" role="tabpanel">
                                <form method="POST">
                                    <input type="hidden" name="action" value="login">
                                    <div class="mb-3">
                                        <label class="form-label small fw-semibold text-muted">Логин</label>
                                        <input type="text" name="username" class="form-control form-control-lg bg-light border-0" placeholder="Ваш логин" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label small fw-semibold text-muted">Пароль</label>
                                        <input type="password" name="password" class="form-control form-control-lg bg-light border-0" placeholder="••••••••" required>
                                    </div>
                                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-semibold shadow-sm">
                                        Войти
                                    </button>
                                </form>
                            </div>

                            <!-- Форма регистрации -->
                            <div class="tab-pane fade" id="registerPane" role="tabpanel">
                                <form method="POST">
                                    <input type="hidden" name="action" value="register">
                                    <div class="mb-3">
                                        <label class="form-label small fw-semibold text-muted">Имя и Фамилия</label>
                                        <input type="text" name="reg_fullname" class="form-control form-control-lg bg-light border-0" placeholder="Иван Иванов" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-semibold text-muted">Логин для входа</label>
                                        <input type="text" name="reg_username" class="form-control form-control-lg bg-light border-0" placeholder="Логин" required>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label small fw-semibold text-muted">Телефон</label>
                                        <input type="text" name="reg_phone" class="form-control form-control-lg bg-light border-0" placeholder="+7 (999) 000-00-00" required>
                                    </div>
                                    <div class="mb-4">
                                        <label class="form-label small fw-semibold text-muted">Пароль</label>
                                        <input type="password" name="reg_password" class="form-control form-control-lg bg-light border-0" placeholder="Придумайте пароль" required>
                                    </div>
                                    <button type="submit" class="btn btn-dark btn-lg w-100 rounded-pill fw-semibold shadow-sm">
                                        Зарегистрироваться
                                    </button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
