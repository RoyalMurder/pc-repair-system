{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5 col-lg-4">
        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3 text-center">
                <h5 class="mb-0">Авторизация в системе</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label small">Логин сотрудника</label>
                        <input type="text" name="username" class="form-control" placeholder="admin" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small">Пароль</label>
                        <input type="password" name="password" class="form-control" placeholder="12345" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                <div class="text-center mt-3">
                    <a href="{{ url_for('register') }}" class="small text-decoration-none">Зарегистрировать нового сотрудника</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
